<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Black Hole</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family: sans-serif; }
canvas { display:block; width:100vw; height:100vh; position: absolute; top: 0; left: 0; }

/* ── Contenedores de Interfaz ── */
.blur-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 10;
  background-color: rgba(255, 255, 255, 0.01); 
  transform: translateZ(0);
  will-change: transform;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 20px;
  padding: 40px;
  pointer-events: none;
}

.gray-panel {
  background-color: rgba(211, 211, 211, 0.15);
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  pointer-events: auto; /* Habilita el hover y click */
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.3s ease;
}

.gray-panel:hover {
  background-color: rgba(211, 211, 211, 0.3);
  transform: scale(1.02);
}

/* ── Panel Flotante ── */
#floating-panel {
  position: fixed;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  width: 250px;
  background: rgba(0, 100, 255, 0.15); /* Azul transparente */
  border: 1px solid rgba(100, 150, 255, 0.3);
  border-radius: 15px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: white;
  z-index: 20;
  pointer-events: none; /* No bloquea el mouse */
  transition: top 0.2s ease-out; /* Movimiento suave */
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.spinning-a {
  font-size: 40px;
  font-weight: bold;
  color: #a0c0ff;
  animation: spin 3s linear infinite;
  margin-bottom: 15px;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* ── Subtítulos y Contenedores de Texto ── */
#subtitles-container {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.6);
  padding: 15px 30px;
  border-radius: 25px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: white;
  font-size: 1.2rem;
  z-index: 20;
  pointer-events: none;
}

.text-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.text-wrapper.visible {
  opacity: 1;
}

/* ── Círculo de Luz Fucsia ── */
.fuchsia-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background-color: #ff00ff;
  box-shadow: 0 0 10px #ff00ff;
  animation: pulse 1.5s infinite alternate;
  flex-shrink: 0;
}

@keyframes pulse {
  0% { opacity: 0.3; box-shadow: 0 0 3px #ff00ff; }
  100% { opacity: 1; box-shadow: 0 0 15px #ff00ff; }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Interfaz WebGL Overlay -->
<div class="blur-overlay">
  <div class="gray-panel"></div>
  <div class="gray-panel"></div>
  <div class="gray-panel"></div>
  <div class="gray-panel"></div>
</div>

<!-- Panel Flotante -->
<div id="floating-panel">
  <div class="spinning-a">A</div>
  <div class="text-wrapper" id="panel-text-wrapper">
    <div class="fuchsia-dot"></div>
    <div id="panel-text"></div>
  </div>
</div>

<!-- Subtítulos -->
<div id="subtitles-container">
  <div class="text-wrapper" id="subtitles-wrapper">
    <div class="fuchsia-dot"></div>
    <div id="subtitle-text"></div>
  </div>
</div>

<script>
/* ── Lógica de Interfaz y Textos ── */
const floatingPanel = document.getElementById('floating-panel');
const panelTextWrapper = document.getElementById('panel-text-wrapper');
const subtitlesWrapper = document.getElementById('subtitles-wrapper');
const panelText = document.getElementById('panel-text');
const subtitleText = document.getElementById('subtitle-text');
const panels = document.querySelectorAll('.gray-panel');

const messages = [
  "veo que necesitas ayuda con eso, no te parece?",
  "en que puedo ayudarte?",
  "Eso que intentas hacer no es posible",
  "te gusto el fondo? esta inspirado en el agujero negro de nuestra galaxia, sagitario A*",
  "buendia buen dia"
];

// Movimiento vertical flotante del panel
window.addEventListener('mousemove', (e) => {
  // Limita para que el cuadro no se salga de la pantalla
  const yPos = Math.max(80, Math.min(window.innerHeight - 80, e.clientY));
  floatingPanel.style.top = yPos + 'px';
});

// Función para cambiar los textos con transición
function updateText(newText) {
  // Ocultar
  panelTextWrapper.classList.remove('visible');
  subtitlesWrapper.classList.remove('visible');
  
  setTimeout(() => {
    // Actualizar texto
    panelText.textContent = newText;
    subtitleText.textContent = newText;
    // Mostrar
    panelTextWrapper.classList.add('visible');
    subtitlesWrapper.classList.add('visible');
  }, 500);
}

// Inicialización del mensaje de bienvenida
setTimeout(() => {
  updateText("bienvenido usuario, como estas?");
}, 500);

// Evento de clic en los 4 cuadros
panels.forEach(panel => {
  panel.addEventListener('click', () => {
    const randomMessage = messages[Math.floor(Math.random() * messages.length)];
    updateText(randomMessage);
  });
});

/* ── WebGL Engine ── */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {antialias:false, powerPreference:'default'});

function resize(){
  canvas.width  = Math.floor(window.innerWidth  * 0.6);
  canvas.height = Math.floor(window.innerHeight * 0.6);
  gl.viewport(0,0,canvas.width,canvas.height);
}
resize();
window.addEventListener('resize', resize);

const VS = `attribute vec2 p; void main(){ gl_Position=vec4(p,0,1); }`;

const FS = `precision highp float;
uniform vec2  R;
uniform float T;

float hash21(vec2 p){
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p+34.23);
  return fract(p.x * p.y);
}
float hash11(float p){ return fract(sin(p*127.1)*43758.5453); }

float vnoise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1,0));
  float c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}

float fbm(vec2 p){
  float v=0.0, a=0.5;
  mat2 m = mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<6;i++){
    v += a*vnoise(p);
    p  = m*p;
    a *= 0.5;
  }
  return v;
}

vec3 diskPalette(float temp, float doppler){
  vec3 c;
  vec3 col0 = vec3(0.18, 0.04, 0.01);
  vec3 col1 = vec3(0.75, 0.18, 0.02);
  vec3 col2 = vec3(1.00, 0.55, 0.08);
  vec3 col3 = vec3(1.00, 0.92, 0.70);
  c = mix(col0, col1, smoothstep(0.0, 0.3, temp));
  c = mix(c,    col2, smoothstep(0.3, 0.65, temp));
  c = mix(c,    col3, smoothstep(0.65,1.0,  temp));
  c = mix(c, c * vec3(0.7, 0.85, 1.4), doppler * 0.35);
  return c;
}

float hitDisk(vec3 ro, vec3 rd, float rMin, float rMax){
  if(abs(rd.y) < 0.0001) return -1.0;
  float t = -ro.y / rd.y;
  if(t < 0.001) return -1.0;
  float r = length((ro + rd*t).xz);
  return (r >= rMin && r <= rMax) ? t : -1.0;
}

vec3 stars(vec3 dir){
  vec3 col = vec3(0.0);
  for(int i=0;i<3;i++){
    float sc = 1.0 + float(i)*2.3;
    vec2 sp = dir.xz / (abs(dir.y) + 0.15) * sc;
    vec2 gi = floor(sp * 8.0);
    vec2 gf = fract(sp * 8.0) - 0.5;
    float sv = hash21(gi + float(i)*7.3);
    float br = hash21(gi + float(i)*3.1 + 1.7);
    if(sv > 0.91){
      float d = length(gf);
      vec3 sc2 = mix(vec3(0.7,0.8,1.0), vec3(1.0,0.9,0.7), br);
      col += sc2 * max(0.0, 0.04 - d) / 0.04 * (0.3 + br*0.7);
    }
  }
  float mw = fbm(dir.xz * 1.5 + 0.3) * smoothstep(0.4,0.0,abs(dir.y));
  col += vec3(0.05, 0.06, 0.12) * mw;
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*R) / R.y;
  vec3 ro = vec3(0.0, 2.2, -10.0);
  vec3 ta = vec3(0.0,  0.0,   0.0);
  vec3 fwd   = normalize(ta - ro);
  vec3 right = normalize(cross(fwd, vec3(0,1,0)));
  vec3 upV   = cross(right, fwd);
  vec3 rd    = normalize(fwd + uv.x*right*1.2 + uv.y*upV*1.2);

  float rs   = 1.0;
  float rISCO = 3.0 * rs;
  float rDiskIn  = 1.8 * rs;
  float rDiskOut = 6.5 * rs;

  vec3 pos = ro;
  vec3 dir = rd;
  float dt = 0.25;

  float accumGlow  = 0.0;
  float diskHit    = 0.0;
  vec3  diskColor  = vec3(0.0);
  bool  swallowed  = false;
  float minR       = 999.0;

  for(int i=0; i<120; i++){
    float r = length(pos);
    minR = min(minR, r);

    if(r < rs * 0.92){ swallowed = true; break; }
    if(r > 30.0) break;

    float rSq = r*r;
    float strength = 1.5 * rs / (rSq + 0.001);
    vec3  toC = -normalize(pos);
    vec3  perp = toC - dir * dot(toC, dir);
    dir = normalize(dir + perp * strength * dt);

    float photonR = abs(r - 1.5*rs);
    accumGlow += 0.004 / (photonR*photonR + 0.012);

    float tDisk = hitDisk(pos, dir, rDiskIn, rDiskOut);
    if(tDisk > 0.0 && tDisk < dt * 2.5){
      vec3 hp  = pos + dir * tDisk;
      float dr = length(hp.xz);

      float temp = 1.0 - smoothstep(rDiskIn, rDiskOut, dr);
      temp += 0.4 * exp(-(dr - rDiskIn) * 2.2);
      temp  = clamp(temp, 0.0, 1.0);

      float logDr  = log(dr / rDiskIn + 1.0);
      float phi    = atan(hp.z, hp.x);
      float turb   = fbm(vec2(logDr * 4.0 - T * 1.4, phi * 1.2)) * 0.7
                   + fbm(vec2(logDr * 9.0 - T * 2.8, phi * 2.5)) * 0.3;
      temp *= turb * 1.5;
      temp  = clamp(temp, 0.0, 1.0);

      float doppler = 0.5 + 0.5 * sin(phi - T * 0.5);
      float beam = pow(0.7 + 0.6 * doppler, 3.0);
      vec3  dc  = diskPalette(temp, doppler) * beam;
      float opa = temp * 2.5;
      diskColor  += dc * opa;
      diskHit    += opa;
    }
    pos += dir * dt;
    dt = max(0.08, (r - rs) * 0.15);
  }

  vec3 col = stars(rd) * 0.9;
  float nebR = length(uv);
  col += vec3(0.005, 0.008, 0.025) * (1.0 - smoothstep(0.2, 1.8, nebR));

  float pgClamped = clamp(accumGlow, 0.0, 8.0);
  col += vec3(0.45, 0.60, 1.00) * pgClamped * 0.35;
  col += vec3(0.80, 0.90, 1.00) * pgClamped * pgClamped * 0.06;

  if(diskHit > 0.001){
    vec3 avgDisk = diskColor / diskHit;
    col += avgDisk * min(diskHit, 3.5);
  }

  float innerGlow = exp(-max(minR - rs*1.2, 0.0) * 0.9);
  col += vec3(0.6, 0.28, 0.04) * innerGlow * 0.25;
  if(swallowed) col = vec3(0.0);

  col = (col * (2.51*col + 0.03)) / (col * (2.43*col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2));
  gl_FragColor = vec4(col, 1.0);
}`;

function compileShader(src, type){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(VS, gl.VERTEX_SHADER));
gl.attachShader(prog, compileShader(FS, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(aP);
gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);

const uR = gl.getUniformLocation(prog, 'R');
const uT = gl.getUniformLocation(prog, 'T');
const FPS = 1000/25;
let last = 0;
const t0 = performance.now();

function loop(now){
  requestAnimationFrame(loop);
  if(now - last < FPS) return;
  last = now;
  gl.uniform2f(uR, canvas.width, canvas.height);
  gl.uniform1f(uT, (now - t0) * 0.001);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
